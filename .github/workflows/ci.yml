name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Typecheck (renderer + electron)
        run: npm run typecheck

      - name: Lint
        run: npx eslint src electron

      - name: Build (renderer export + electron bundle)
        run: npm run build
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
